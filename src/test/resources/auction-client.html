<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080810;
            --surface: #0e0e1a;
            --surface2: #13131f;
            --border: #1c1c2e;
            --border2: #252538;
            --accent: #00ff88;
            --accent2: #00ccff;
            --warn: #ff4d6d;
            --gold: #ffd700;
            --text: #d0d0e8;
            --text-dim: #44445a;
            --text-mid: #888899;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            display: grid;
            grid-template-rows: 56px 1fr;
        }

        /* grid bg */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background-image:
                    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        /* ─── HEADER ─── */
        header {
            position: relative; z-index: 10;
            display: flex; align-items: center; gap: 16px;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,8,16,0.9);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-family: var(--sans);
            font-size: 18px; font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .logo em { color: var(--text-dim); font-style: normal; font-weight: 400; font-size: 13px; margin-left: 6px; }

        .conn-bar {
            display: flex; align-items: center; gap: 8px;
            margin-left: auto;
        }

        .ws-url {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--text);
            font-family: var(--mono); font-size: 12px;
            padding: 5px 12px; border-radius: 4px;
            outline: none; width: 220px;
            transition: border-color 0.2s;
        }
        .ws-url:focus { border-color: var(--accent); }

        .pill {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-mid);
            padding: 5px 12px;
            border: 1px solid var(--border2);
            border-radius: 99px;
            letter-spacing: 0.06em; text-transform: uppercase;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); transition: all 0.3s; }
        .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 2s infinite; }
        .dot.err { background: var(--warn); }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .hbtn {
            font-family: var(--mono); font-size: 11px; font-weight: 600;
            padding: 5px 14px; border-radius: 4px; border: none; cursor: pointer;
            letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.15s;
        }
        .hbtn-connect { background: var(--accent); color: #000; }
        .hbtn-connect:hover { filter: brightness(1.1); }
        .hbtn-connect:disabled { opacity: 0.3; cursor: not-allowed; filter: none; }
        .hbtn-disconnect { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
        .hbtn-disconnect:hover { background: var(--warn); color: #000; }

        /* ─── LAYOUT ─── */
        .layout {
            position: relative; z-index: 1;
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            height: 100%;
            overflow: hidden;
            border-top: 1px solid var(--border);
        }

        .col {
            display: flex; flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }
        .col:last-child { border-right: none; }

        .col-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--text-dim);
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
        }
        .tag {
            background: rgba(0,255,136,0.1); color: var(--accent);
            font-size: 9px; padding: 2px 7px; border-radius: 3px; font-weight: 600;
        }
        .tag-blue { background: rgba(0,204,255,0.1); color: var(--accent2); }

        /* ─── LEFT COL: Setup ─── */
        .setup-body {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .section {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            overflow: hidden;
        }
        .section-head {
            padding: 10px 14px;
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--text-mid); border-bottom: 1px solid var(--border);
        }
        .section-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); }

        input[type=text], input[type=number] {
            background: var(--bg);
            border: 1px solid var(--border2);
            color: var(--text); font-family: var(--mono); font-size: 13px;
            padding: 8px 12px; border-radius: 4px; outline: none; width: 100%;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        input[type=number]::-webkit-inner-spin-button { opacity: 0; }

        .amount-input {
            font-size: 28px !important; font-weight: 700 !important;
            padding: 10px 12px !important;
            color: var(--accent) !important;
        }

        .action-btn {
            width: 100%; padding: 11px; border: none; border-radius: 4px;
            font-family: var(--mono); font-size: 12px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
        }
        .action-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .action-btn:active { transform: translateY(0); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; filter: none; }

        .btn-start { background: #7c6af7; color: #fff; }
        .btn-bid { background: var(--accent); color: #000; }

        .status-line {
            font-size: 11px; color: var(--text-mid);
            padding: 6px 0 0;
            min-height: 20px;
        }
        .status-line.ok { color: var(--accent); }
        .status-line.fail { color: var(--warn); }

        /* ─── CENTER: Auction Board ─── */
        .board {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden;
        }

        .auction-hero {
            padding: 28px 32px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .auction-id-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--text-dim); margin-bottom: 6px;
        }

        .auction-id-val {
            font-family: var(--sans); font-size: 22px; font-weight: 700;
            color: var(--text); margin-bottom: 20px;
        }

        .bid-row {
            display: flex; align-items: flex-end; gap: 24px;
        }

        .highest-bid-block { flex: 1; }
        .hb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 4px; }
        .hb-value {
            font-family: var(--sans); font-size: 52px; font-weight: 800;
            color: var(--accent); line-height: 1;
            transition: all 0.3s;
        }
        .hb-value.bump { animation: hbump 0.35s ease; }
        @keyframes hbump {
            0%{transform:scale(1)} 40%{transform:scale(1.06);color:#fff} 100%{transform:scale(1)}
        }

        .winner-block { text-align: right; }
        .winner-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 4px; }
        .winner-val { font-size: 15px; font-weight: 600; color: var(--text); }

        .status-bar {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 32px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .auction-status {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
            padding: 4px 12px; border-radius: 99px; font-weight: 600;
        }
        .status-idle { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border2); }
        .status-live { background: rgba(0,255,136,0.12); color: var(--accent); border: 1px solid rgba(0,255,136,0.3); animation: blink 2s infinite; }
        .status-closed { background: rgba(255,77,109,0.12); color: var(--warn); border: 1px solid rgba(255,77,109,0.3); }
        .status-winner { background: rgba(255,215,0,0.12); color: var(--gold); border: 1px solid rgba(255,215,0,0.3); }

        /* bid history */
        .bid-history {
            flex: 1; overflow-y: auto; padding: 16px 32px;
        }
        .bid-history::-webkit-scrollbar { width: 3px; }
        .bid-history::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        .bid-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px; align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .bid-item:last-child { border-bottom: none; }

        .bid-time { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
        .bid-bidder { font-size: 13px; color: var(--text); }
        .bid-bidder .me { color: var(--accent2); }
        .bid-amount { font-size: 15px; font-weight: 700; color: var(--text); text-align: right; }
        .bid-amount.top { color: var(--accent); }

        .empty-board {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-dim); gap: 10px;
        }
        .empty-icon { font-size: 36px; opacity: 0.2; }

        /* closed overlay */
        .closed-banner {
            margin: 16px 32px;
            padding: 16px 20px;
            background: rgba(255,215,0,0.06);
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 6px;
            display: none;
        }
        .closed-banner.show { display: block; }
        .cb-title { font-family: var(--sans); font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
        .cb-detail { font-size: 12px; color: var(--text-mid); }

        /* ─── RIGHT COL: Log ─── */
        .log-body {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 3px;
        }
        .log-body::-webkit-scrollbar { width: 3px; }
        .log-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        .log-entry {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 8px; align-items: baseline;
            padding: 5px 8px; border-radius: 3px;
            font-size: 11px;
            animation: fadeUp 0.2s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.sys { background: rgba(255,77,109,0.06); }
        .log-entry.sent { background: rgba(0,204,255,0.05); }
        .log-entry.recv-ok { background: rgba(0,255,136,0.05); }
        .log-entry.recv-fail { background: rgba(255,77,109,0.05); }
        .log-entry.broadcast { background: rgba(255,215,0,0.04); }

        .log-t { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
        .log-badge {
            font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
            padding: 1px 5px; border-radius: 2px; white-space: nowrap;
        }
        .log-entry.sys .log-badge { background: rgba(255,77,109,0.2); color: var(--warn); }
        .log-entry.sent .log-badge { background: rgba(0,204,255,0.2); color: var(--accent2); }
        .log-entry.recv-ok .log-badge { background: rgba(0,255,136,0.2); color: var(--accent); }
        .log-entry.recv-fail .log-badge { background: rgba(255,77,109,0.2); color: var(--warn); }
        .log-entry.broadcast .log-badge { background: rgba(255,215,0,0.2); color: var(--gold); }
        .log-msg { color: var(--text-mid); word-break: break-all; line-height: 1.4; }

        .log-clear {
            margin-left: auto; background: none; border: none;
            color: var(--text-dim); font-size: 10px; cursor: pointer;
            font-family: var(--mono); letter-spacing: 0.05em; text-transform: uppercase;
        }
        .log-clear:hover { color: var(--text); }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">auction<span style="color:var(--text-dim);font-weight:400">lab</span><em>/ live</em></div>
    <input type="text" class="ws-url" id="wsUrl" value="ws://localhost:9090" placeholder="WebSocket URL" />
    <div class="pill"><div class="dot" id="dot"></div><span id="connText">disconnected</span></div>
    <button class="hbtn hbtn-connect" id="btnConn" onclick="connect()">Connect</button>
    <button class="hbtn hbtn-disconnect" id="btnDisconn" onclick="disconnect()" style="display:none">Disconnect</button>
</header>

<!-- MAIN -->
<div class="layout">

    <!-- LEFT: Setup -->
    <div class="col">
        <div class="col-header">setup</div>
        <div class="setup-body">

            <!-- Auction Start -->
            <div class="section">
                <div class="section-head">경매 시작</div>
                <div class="section-body">
                    <div class="field">
                        <label>Auction ID</label>
                        <input type="text" id="startAuctionId" value="auction-001" />
                    </div>
                    <div class="field">
                        <label>Duration (seconds)</label>
                        <input type="number" id="duration" value="60" min="1" />
                    </div>
                    <button class="action-btn btn-start" onclick="startAuction()">▶ Start Auction</button>
                    <div class="status-line" id="startStatus"></div>
                </div>
            </div>

            <!-- Bid -->
            <div class="section">
                <div class="section-head">입찰</div>
                <div class="section-body">
                    <div class="field">
                        <label>Auction ID</label>
                        <input type="text" id="bidAuctionId" value="auction-001" />
                    </div>
                    <div class="field">
                        <label>Bidder ID (나)</label>
                        <input type="text" id="bidderId" value="user-001" />
                    </div>
                    <div class="field">
                        <label>Amount</label>
                        <input type="number" class="amount-input" id="amount" value="5000" min="1" />
                    </div>
                    <button class="action-btn btn-bid" id="btnBid" onclick="placeBid()" disabled>↑ Place Bid</button>
                    <div class="status-line" id="bidStatus"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- CENTER: Board -->
    <div class="col board" style="border-right:1px solid var(--border);">

        <div class="auction-hero">
            <div class="auction-id-label">현재 경매</div>
            <div class="auction-id-val" id="boardAuctionId">—</div>
            <div class="bid-row">
                <div class="highest-bid-block">
                    <div class="hb-label">최고 입찰가</div>
                    <div class="hb-value" id="highestBid">—</div>
                </div>
                <div class="winner-block">
                    <div class="winner-label">최고 입찰자</div>
                    <div class="winner-val" id="highestBidder">—</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="auction-status status-idle" id="auctionStatus">idle</div>
        </div>

        <div class="closed-banner" id="closedBanner">
            <div class="cb-title" id="closedTitle">🏆 경매 종료</div>
            <div class="cb-detail" id="closedDetail"></div>
        </div>

        <div class="bid-history" id="bidHistory">
            <div class="empty-board" id="emptyBoard">
                <div class="empty-icon">⬡</div>
                <div style="font-size:12px;">경매를 시작하면 입찰 내역이 여기에 표시됩니다</div>
            </div>
        </div>

    </div>

    <!-- RIGHT: Log -->
    <div class="col">
        <div class="col-header">
            message log
            <span class="tag tag-blue" id="logCount">0</span>
            <button class="log-clear" onclick="clearLog()">clear</button>
        </div>
        <div class="log-body" id="logBody"></div>
    </div>

</div>

<script>
    let ws = null;
    let logCount = 0;
    let myBidderId = () => document.getElementById('bidderId').value;
    let currentAuctionId = null;
    let bidItems = [];

    // ── WebSocket ──
    function connect() {
        const url = document.getElementById('wsUrl').value.trim();
        ws = new WebSocket(url);

        ws.onopen = () => {
            setConn(true);
            addLog('sys', 'SYS', `Connected to ${url}`);
            document.getElementById('btnBid').disabled = false;
        };

        ws.onmessage = (e) => {
            const msg = e.data;
            handleServerMessage(msg);
        };

        ws.onerror = () => {
            setConn(false, true);
            addLog('sys', 'ERR', 'Connection error');
        };

        ws.onclose = () => {
            setConn(false);
            addLog('sys', 'SYS', 'Disconnected');
            document.getElementById('btnBid').disabled = true;
        };
    }

    function disconnect() {
        if (ws) ws.close();
    }

    function setConn(on, err = false) {
        const dot = document.getElementById('dot');
        const text = document.getElementById('connText');
        dot.className = 'dot' + (on ? ' on' : err ? ' err' : '');
        text.textContent = on ? 'connected' : err ? 'error' : 'disconnected';
        document.getElementById('btnConn').style.display = on ? 'none' : '';
        document.getElementById('btnDisconn').style.display = on ? '' : 'none';
    }

    // ── Server message handler ──
    function handleServerMessage(msg) {
        // bid success
        if (msg.startsWith('bid success')) {
            addLog('recv-ok', 'RECV', msg);
            const m = msg.match(/highestBid:\s*([\d,]+)/);
            if (m) updateHighestBid(parseInt(m[1].replace(',','')), myBidderId(), true);
            setBidStatus(msg, true);
        }
        // bid fail
        else if (msg.startsWith('bid fail')) {
            addLog('recv-fail', 'RECV', msg);
            setBidStatus(msg, false);
        }
        // broadcast: new highest bid
        else if (msg.startsWith('New highest bid')) {
            addLog('broadcast', 'CAST', msg);
            const m = msg.match(/New highest bid:\s*(\d+)\s*by\s*(.+)/);
            if (m) {
                updateHighestBid(parseInt(m[1]), m[2].trim(), false);
                addBidItem(m[2].trim(), parseInt(m[1]));
            }
        }
        // broadcast: auction closed
        else if (msg.startsWith('Auction closed')) {
            addLog('broadcast', 'END', msg);
            setAuctionClosed(msg);
        }
        // error
        else if (msg.startsWith('Error')) {
            addLog('recv-fail', 'ERR', msg);
            setBidStatus(msg, false);
        }
        else {
            addLog('recv-ok', 'RECV', msg);
        }
    }

    // ── Auction Start ──
    async function startAuction() {
        const auctionId = document.getElementById('startAuctionId').value.trim();
        const duration = parseInt(document.getElementById('duration').value);
        const el = document.getElementById('startStatus');

        try {
            const res = await fetch('http://localhost:8080/api/auction/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ auctionId, durationSeconds: duration })
            });
            const text = await res.text();

            if (res.ok) {
                el.textContent = '✓ ' + text;
                el.className = 'status-line ok';
                currentAuctionId = auctionId;
                document.getElementById('bidAuctionId').value = auctionId;
                document.getElementById('boardAuctionId').textContent = auctionId;
                setAuctionLive();
                clearBidHistory();
            } else {
                el.textContent = '✗ ' + text;
                el.className = 'status-line fail';
            }
            addLog('sys', 'API', `POST /api/auction/start → ${res.status}`);
        } catch(e) {
            el.textContent = '✗ ' + e.message;
            el.className = 'status-line fail';
            addLog('sys', 'ERR', `API failed: ${e.message}`);
        }
    }

    // ── Place Bid ──
    function placeBid() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const payload = {
            auctionId: document.getElementById('bidAuctionId').value,
            bidderId: myBidderId(),
            amount: parseInt(document.getElementById('amount').value)
        };

        ws.send(JSON.stringify(payload));
        addLog('sent', 'SEND', JSON.stringify(payload));
        document.getElementById('bidStatus').textContent = '';
    }

    // ── UI Updates ──
    function updateHighestBid(amount, bidder, isMe) {
        const el = document.getElementById('highestBid');
        el.textContent = amount.toLocaleString();
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
        document.getElementById('highestBidder').textContent = (isMe ? '🟢 ' : '') + bidder;
    }

    function addBidItem(bidder, amount) {
        const empty = document.getElementById('emptyBoard');
        if (empty) empty.remove();

        const isMe = bidder === myBidderId();
        const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        const history = document.getElementById('bidHistory');

        const item = document.createElement('div');
        item.className = 'bid-item';
        item.innerHTML = `
      <span class="bid-time">${time}</span>
      <span class="bid-bidder ${isMe ? 'me' : ''}">${isMe ? '◉ ' : '○ '}${bidder}</span>
      <span class="bid-amount top">${amount.toLocaleString()}</span>
    `;
        history.prepend(item);
        bidItems.push(item);
    }

    function setAuctionLive() {
        const s = document.getElementById('auctionStatus');
        s.textContent = '● live';
        s.className = 'auction-status status-live';
        document.getElementById('closedBanner').classList.remove('show');
        document.getElementById('highestBid').textContent = '—';
        document.getElementById('highestBidder').textContent = '—';
    }

    function setAuctionClosed(msg) {
        const s = document.getElementById('auctionStatus');
        s.className = 'auction-status status-closed';
        s.textContent = '■ closed';

        const banner = document.getElementById('closedBanner');
        banner.classList.add('show');

        const m = msg.match(/Winner:\s*(.+?)\s*with\s*(\d+)/);
        if (m) {
            const isMe = m[1] === myBidderId();
            document.getElementById('closedTitle').textContent = isMe ? '🏆 낙찰! 축하합니다!' : '🏁 경매 종료';
            document.getElementById('closedDetail').textContent = `낙찰자: ${m[1]}  |  낙찰가: ${parseInt(m[2]).toLocaleString()}`;
            document.getElementById('auctionStatus').className = isMe
                ? 'auction-status status-winner'
                : 'auction-status status-closed';
        } else {
            document.getElementById('closedTitle').textContent = '🏁 경매 종료';
            document.getElementById('closedDetail').textContent = '낙찰자 없음';
        }
    }

    function setBidStatus(msg, ok) {
        const el = document.getElementById('bidStatus');
        el.textContent = ok ? '✓ ' + msg : '✗ ' + msg;
        el.className = 'status-line ' + (ok ? 'ok' : 'fail');
    }

    function clearBidHistory() {
        const h = document.getElementById('bidHistory');
        h.innerHTML = '<div class="empty-board" id="emptyBoard"><div class="empty-icon">⬡</div><div style="font-size:12px;">경매를 시작하면 입찰 내역이 여기에 표시됩니다</div></div>';
        bidItems = [];
    }

    // ── Log ──
    function addLog(type, badge, msg) {
        const body = document.getElementById('logBody');
        const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `
      <span class="log-t">${time}</span>
      <span class="log-badge">${badge}</span>
      <span class="log-msg">${msg}</span>
    `;
        body.appendChild(entry);
        body.scrollTop = body.scrollHeight;
        logCount++;
        document.getElementById('logCount').textContent = logCount;
    }

    function clearLog() {
        document.getElementById('logBody').innerHTML = '';
        logCount = 0;
        document.getElementById('logCount').textContent = '0';
    }

    // Enter to bid
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !document.getElementById('btnBid').disabled) placeBid();
    });
</script>
</body>
</html>
