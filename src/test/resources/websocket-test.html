<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Lab — WebSocket Test</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --border: #1e1e2e;
            --accent: #00ff88;
            --accent-dim: #00ff8833;
            --warn: #ff6b35;
            --warn-dim: #ff6b3522;
            --text: #e0e0f0;
            --text-dim: #555570;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow-x: hidden;
        }

        /* grid overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                    linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 1;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: var(--sans);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .logo span { color: var(--text-dim); font-weight: 400; }

        .status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 99px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
            transition: background 0.3s;
        }

        .status-dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
        .status-dot.error { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        main {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto 1fr;
            gap: 1px;
            background: var(--border);
            height: calc(100vh - 73px);
        }

        .panel {
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .tag {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 9px;
        }

        /* Connection panel */
        .connect-panel {
            grid-column: 1 / 3;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
        }

        .connect-panel .panel-header {
            border: none;
            padding: 0;
            white-space: nowrap;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }

        .btn-connect {
            background: var(--accent);
            color: #000;
        }

        .btn-connect:hover { filter: brightness(1.15); }
        .btn-connect:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }

        .btn-disconnect {
            background: var(--warn-dim);
            color: var(--warn);
            border: 1px solid var(--warn);
        }

        .btn-disconnect:hover { background: var(--warn); color: #000; }

        /* Form panel */
        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
        }

        input[type="number"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--mono);
            font-size: 24px;
            font-weight: 700;
            padding: 10px 14px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus { border-color: var(--accent); }
        input[type="number"]::-webkit-inner-spin-button { opacity: 0; }

        .btn-send {
            margin-top: auto;
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        .btn-send:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-send:active { transform: translateY(0); }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none; filter: none; }

        /* Log panel */
        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-body::-webkit-scrollbar { width: 4px; }
        .log-body::-webkit-scrollbar-track { background: transparent; }
        .log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .log-entry {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 10px;
            align-items: baseline;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 12px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.sent { background: #00ff8808; }
        .log-entry.received { background: #ffffff05; }
        .log-entry.system { background: #ff6b3510; }
        .log-entry.success { background: #00ff8812; }
        .log-entry.fail { background: #ff6b3512; }

        .log-time { color: var(--text-dim); font-size: 10px; white-space: nowrap; }

        .log-type {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 1px 6px;
            border-radius: 2px;
            white-space: nowrap;
        }

        .log-entry.sent .log-type { background: var(--accent-dim); color: var(--accent); }
        .log-entry.received .log-type { background: #ffffff15; color: #aaa; }
        .log-entry.system .log-type { background: var(--warn-dim); color: var(--warn); }
        .log-entry.success .log-type { background: var(--accent-dim); color: var(--accent); }
        .log-entry.fail .log-type { background: var(--warn-dim); color: var(--warn); }

        .log-msg { color: var(--text); word-break: break-all; }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            gap: 8px;
            font-size: 12px;
        }

        .empty-state .icon { font-size: 28px; opacity: 0.3; }

        /* highest bid display */
        .bid-display {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .bid-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }
        .bid-value { font-family: var(--sans); font-size: 32px; font-weight: 800; color: var(--accent); transition: all 0.3s; }
        .bid-value.bump { animation: bump 0.3s ease; }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">auction<span>lab</span> <span style="color: var(--text-dim); font-size:13px; font-weight:400;">/ ws test</span></div>
    <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">disconnected</span>
    </div>
</header>

<main>
    <!-- Connection bar -->
    <div class="panel connect-panel" style="border-bottom: 1px solid var(--border);">
        <div class="panel-header">endpoint</div>
        <input type="text" id="wsUrl" value="ws://localhost:9090" />
        <button class="btn-connect" id="btnConnect" onclick="connect()">Connect</button>
        <button class="btn-disconnect" id="btnDisconnect" onclick="disconnect()" style="display:none;">Disconnect</button>
    </div>

    <!-- Auction Start form -->
    <div class="panel">
        <div class="panel-header">
            auction start
            <span class="tag">POST /api/auction/start</span>
        </div>
        <div class="form-body">
            <div class="field">
                <label>Auction ID</label>
                <input type="text" id="startAuctionId" value="auction-001" />
            </div>
            <div class="field">
                <label>Duration (seconds)</label>
                <input type="number" id="durationSeconds" value="30" min="1" />
            </div>
            <div class="bid-display">
                <span class="bid-label">Status</span>
                <span class="bid-value" id="startStatus" style="font-size:16px;">—</span>
            </div>
            <button class="btn-send" id="btnStart" onclick="startAuction()" style="background: #7c6af7;">
                ▶ START AUCTION
            </button>
        </div>
    </div>

    <!-- Bid form -->
    <div class="panel">
        <div class="panel-header">
            bid request
            <span class="tag">→ auction.bid.request</span>
        </div>
        <div class="form-body">
            <div class="field">
                <label>Auction ID</label>
                <input type="text" id="auctionId" value="auction-001" />
            </div>
            <div class="field">
                <label>Bidder ID</label>
                <input type="text" id="bidderId" value="user-001" />
            </div>
            <div class="field">
                <label>Amount</label>
                <input type="number" id="amount" value="5000" min="1" />
            </div>
            <div class="bid-display">
                <span class="bid-label">Last reply</span>
                <span class="bid-value" id="lastReply">—</span>
            </div>
            <button class="btn-send" id="btnSend" onclick="sendBid()" disabled>
                ↑ PLACE BID
            </button>
        </div>
    </div>

    <!-- Log -->
    <div class="panel">
        <div class="panel-header">
            message log
            <span class="tag" id="logCount">0 messages</span>
            <button onclick="clearLog()" style="margin-left:auto; background:none; border:none; color:var(--text-dim); font-size:10px; cursor:pointer; font-family:var(--mono); letter-spacing:0.05em;">CLEAR</button>
        </div>
        <div class="log-body" id="logBody">
            <div class="empty-state">
                <div class="icon">⬡</div>
                <div>connect to start</div>
            </div>
        </div>
    </div>
</main>

<script>
    let ws = null;
    let logCount = 0;

    async function startAuction() {
        const auctionId = document.getElementById('startAuctionId').value.trim();
        const durationSeconds = parseInt(document.getElementById('durationSeconds').value);
        const statusEl = document.getElementById('startStatus');

        try {
            const res = await fetch('http://localhost:8080/api/auction/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ auctionId, durationSeconds })
            });
            const text = await res.text();
            statusEl.textContent = res.ok ? '✓ started' : '✗ failed';
            statusEl.style.color = res.ok ? 'var(--accent)' : 'var(--warn)';
            addLog('system', 'SYS', `Auction start: ${text}`);
        } catch (e) {
            statusEl.textContent = '✗ error';
            statusEl.style.color = 'var(--warn)';
            addLog('system', 'ERR', `Auction start failed: ${e.message}`);
        }
    }

    function connect() {
        const url = document.getElementById('wsUrl').value.trim();
        if (!url) return;

        ws = new WebSocket(url);

        ws.onopen = () => {
            setStatus('connected', true);
            addLog('system', 'SYS', `Connected to ${url}`);
            document.getElementById('btnSend').disabled = false;
            document.getElementById('btnConnect').style.display = 'none';
            document.getElementById('btnDisconnect').style.display = '';
        };

        ws.onmessage = (e) => {
            const msg = e.data;
            const isSuccess = msg.includes('success');
            addLog(isSuccess ? 'success' : 'fail', 'RECV', msg);

            const el = document.getElementById('lastReply');
            el.textContent = msg;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
        };

        ws.onerror = () => {
            addLog('system', 'ERR', 'WebSocket error');
            setStatus('error', false);
        };

        ws.onclose = () => {
            setStatus('disconnected', false);
            addLog('system', 'SYS', 'Disconnected');
            document.getElementById('btnSend').disabled = true;
            document.getElementById('btnConnect').style.display = '';
            document.getElementById('btnDisconnect').style.display = 'none';
            document.getElementById('lastReply').textContent = '—';
        };
    }

    function disconnect() {
        if (ws) ws.close();
    }

    function sendBid() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        const payload = {
            auctionId: document.getElementById('auctionId').value,
            bidderId: document.getElementById('bidderId').value,
            amount: parseInt(document.getElementById('amount').value)
        };

        const msg = JSON.stringify(payload);
        ws.send(msg);
        addLog('sent', 'SEND', msg);
    }

    function addLog(type, label, msg) {
        const body = document.getElementById('logBody');

        // remove empty state
        const empty = body.querySelector('.empty-state');
        if (empty) empty.remove();

        const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `
      <span class="log-time">${time}</span>
      <span class="log-type">${label}</span>
      <span class="log-msg">${msg}</span>
    `;
        body.appendChild(entry);
        body.scrollTop = body.scrollHeight;

        logCount++;
        document.getElementById('logCount').textContent = `${logCount} messages`;
    }

    function clearLog() {
        const body = document.getElementById('logBody');
        body.innerHTML = '<div class="empty-state"><div class="icon">⬡</div><div>connect to start</div></div>';
        logCount = 0;
        document.getElementById('logCount').textContent = '0 messages';
    }

    function setStatus(state, connected) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        dot.className = 'status-dot' + (connected ? ' connected' : state === 'error' ? ' error' : '');
        text.textContent = state;
    }

    // Enter key to send
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !document.getElementById('btnSend').disabled) sendBid();
    });
</script>
</body>
</html>
